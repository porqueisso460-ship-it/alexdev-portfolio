
name: Install Alex Dev Portfolio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract portfolio
        run: |
          mkdir -p extracted
          unzip -o alexdev-portfolio.zip -d extracted
          cp extracted/alexdev-portfolio/* .
          rm -rf extracted
          rm alexdev-portfolio.zip

      - name: Commit portfolio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css script.js README.md alexdev-portfolio.zip
          git commit -m "Install Alex Dev portfolio"
          git push
